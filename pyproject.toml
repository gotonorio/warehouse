# https://docs.astral.sh/ruff/configuration/

[tool.ruff]
exclude = [
    "__pycache__",
    ".git",
]

line-length = 120
indent-width = 4

# -----------------------------------------------
# RuffのLint（静的解析・自動修正）設定 ★ここを追加
# -----------------------------------------------
[tool.ruff.lint]
# "I" を含めることで isort（importの並び替え）が有効になります
# 良く使われる標準的なルールセット例: "E" (pycodestyle errors), "F" (Pyflakes), "I" (isort)
select = ["E", "F", "I"]

# -----------------------------------------------
# Ruffの自動成形指定
# -----------------------------------------------
[tool.ruff.format]
# 1. ダブルクォーテーションにする
quote-style = "double"
# 2. インデントはスペース
indent-style = "space"
# 3. 既存の改行コード（LF または CRLF）を自動検出して維持する
line-ending = "auto"

# -----------------------------------------------
# django-pytest用設定
# -----------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "warehouse.settings"
python_files = ["test_*.py", "*_test.py"]
